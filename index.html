<style>
  :root {

  /* 9:16 stage that fills a 1080x1920 viewport exactly and letterboxes elsewhere */

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   Parameters
   ?build=0  skip the 1 s build-in     ?t=4.2  freeze at cycle time
   ?q=0.5    render-resolution factor  ?ao=0   disable GTAO
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const BUILD = Q.get('build') === '0' ? 0 : 1.0;   // seconds of build-in
const LOOP = 10;                                   // seconds per action cycle
const FREEZE = Q.has('t') ? parseFloat(Q.get('t')) : null;
// Phones/tablets get a lighter render profile (half-res AO, no MSAA, pixel ratio <= 2,
// fewer shadow casters); every device also gets adaptive resolution to hold ~60 fps.
// ?lite=1 / ?lite=0 forces the profile on or off.
const MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const LITE = Q.has('lite') ? Q.get('lite') !== '0' : MOBILE;

/* ---------------- math helpers ---------------- */
const TAU = Math.PI * 2, PI = Math.PI, HP = Math.PI / 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eSine = t => 0.5 - 0.5 * Math.cos(PI * clamp(t));
const eOut = t => 1 - Math.pow(1 - clamp(t), 3);
const eBack = t => { t = clamp(t); const s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function eTrap(t, a = 0.28) { // trapezoidal velocity profile, eased start/stop
  t = clamp(t); const v = 1 / (1 - a);
  if (t < a) return 0.5 * v * t * t / a;
  if (t > 1 - a) { const u = 1 - t; return 1 - 0.5 * v * u * u / a; }
  return v * (t - a / 2);
}
const mod = (x, m) => ((x % m) + m) % m;
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = rng(1512);
const pick = arr => arr[Math.floor(rand() * arr.length)];

/* ---------------- palette ---------------- */
// high-key "toy diorama" palette: white world, royal/navy blue accents, a few warm pops
const C = {
  ground: 0xeef0f2, slab: 0xdfe3e8, yard: 0xe2e5e9, hallFloor: 0xf4f5f6, apron: 0xe9ebee,
  street: 0xcdd2d8, curb: 0xffffff, walk: 0xf6f7f8, line: 0xffffff,
  grass: 0xc3e2ad, grass2: 0xb8dca2, grass3: 0xcde7bc,
  blue: 0x2f6db3, navy: 0x233a8b, orange: 0xd4651c, anth: 0x1c2326, yellow: 0xf2b705, red: 0xe0533f,
  sheet: 0xe8edf1, rib: 0xcbd3da, steel: 0xdfe4e9, concrete: 0xf4f5f6,
  wood: 0xdfbb88, wood2: 0xcca46f, tyre: 0x2b3137, skin: 0xefc29f,
  white: 0xfbfbfb, kraft: 0xe7d0a7, glass: 0x22305e, vest: 0xf07c18,
};
const LOADS = [C.blue, C.blue, C.navy, 0xf8f8f8, 0xf8f8f8, 0xf8f8f8, C.orange, C.kraft, C.kraft, 0x8fb4de];

/* ---------------- renderer / scene ---------------- */
const stage = document.getElementById('stage');
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: Q.has('shot') });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;   // PCF + radius = soft, blurred edges
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 9 / 16, 20, 3200);

// Vehicles driving off the street are sliced cleanly at the slab edge.
const EDGE = 58;
const CLIP = [new THREE.Plane(new THREE.Vector3(-1, 0, 0), EDGE), new THREE.Plane(new THREE.Vector3(1, 0, 0), EDGE)];

/* ---------------- materials ---------------- */
const MATS = new Map();
function M(color, o = {}) {
  const key = color + '|' + JSON.stringify(o);
  let m = MATS.get(key);
  if (!m) {
    m = new THREE.MeshStandardMaterial({ color, roughness: o.r ?? 0.86, metalness: o.m ?? 0 });
    if (o.op !== undefined && o.op < 1) { m.transparent = true; m.opacity = o.op; m.depthWrite = false; }
    if (o.e !== undefined) { m.emissive = new THREE.Color(o.e); m.emissiveIntensity = o.ei ?? 1; }
    if (o.clip) { m.clippingPlanes = CLIP; m.clipShadows = true; }
    MATS.set(key, m);
  }
  return m;
}
const V = (color, o = {}) => M(color, { ...o, clip: true });   // vehicle (clipped) material
const VCMS = new Map();
function VCM(r, m, clip) {
  const k = r + '|' + m + '|' + clip;
  if (!VCMS.has(k)) { const mt = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: r, metalness: m }); if (clip) { mt.clippingPlanes = CLIP; mt.clipShadows = true; } VCMS.set(k, mt); }
  return VCMS.get(k);
}
function shade(hex, f) { const c = new THREE.Color(hex); c.multiplyScalar(f); return c.getHex(); }

/* ---------------- geometry: RoundedBoxGeometry everywhere ---------------- */
const GEO = new Map();
function RB(w, h, d, r, seg = 1) {
  r = Math.max(0.0005, Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4));
  const k = `${w.toFixed(3)}|${h.toFixed(3)}|${d.toFixed(3)}|${r.toFixed(4)}|${seg}`;
  let g = GEO.get(k);
  if (!g) { g = new RoundedBoxGeometry(w, h, d, seg, r); GEO.set(k, g); }
  return g;
}
const _m = new THREE.Matrix4(), _m2 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();
const _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();

// Collects rounded boxes and merges them per material (few draw calls).
class Parts {
  constructor() { this.map = new Map(); }
  box(w, h, d, mat, x, y, z, o = {}) {
    const r = o.r ?? Math.min(0.1, Math.min(w, h, d) * 0.33);
    const g = RB(w, h, d, r, o.seg ?? 1).clone();
    _e.set(o.rx || 0, o.ry || 0, o.rz || 0, o.order || 'XYZ');
    _q.setFromEuler(_e); _v.set(x, y, z); _s.set(1, 1, 1);
    _m.compose(_v, _q, _s);
    if (o.pre) _m.multiply(o.pre);
    g.applyMatrix4(_m);
    let a = this.map.get(mat); if (!a) this.map.set(mat, (a = []));
    a.push(g);
    return this;
  }
  // bottom-anchored helper
  bb(w, h, d, mat, x, y0, z, o) { return this.box(w, h, d, mat, x, y0 + h / 2, z, o); }
  build({ cast = true, receive = true } = {}) {
    const grp = new THREE.Group();
    // plain opaque materials are baked into vertex colours and merged per roughness bucket
    const vc = new Map(), rest = [];
    for (const [mat, list] of this.map) {
      if (mat && mat.isMeshStandardMaterial && !mat.transparent && mat.emissive.getHex() === 0) {
        const rb = mat.roughness < 0.5 ? 0.42 : mat.roughness < 0.8 ? 0.66 : 0.9, mb = mat.metalness >= 0.2 ? 0.3 : 0;
        const key = rb + '|' + mb + '|' + (mat.clippingPlanes ? 1 : 0);
        let e = vc.get(key); if (!e) vc.set(key, (e = { rb, mb, clip: !!mat.clippingPlanes, list: [] }));
        for (const g of list) {
          const n = g.attributes.position.count, col = new Float32Array(n * 3), c = mat.color;
          for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
          g.setAttribute('color', new THREE.BufferAttribute(col, 3));
          e.list.push(g);
        }
      } else rest.push([mat, list]);
    }
    for (const e of vc.values()) {
      const mesh = new THREE.Mesh(e.list.length === 1 ? e.list[0] : mergeGeometries(e.list, false), VCM(e.rb, e.mb, e.clip));
      mesh.castShadow = cast; mesh.receiveShadow = receive;
      grp.add(mesh);
    }
    for (const [mat, list] of rest) {
      const geo = list.length === 1 ? list[0] : mergeGeometries(list, false);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = cast && !mat.transparent;
      mesh.receiveShadow = receive;
      if (mat.transparent) mesh.userData.noAO = true;
      grp.add(mesh);
    }
    return grp;
  }
}
function mergedGeo(fn) { const P = new Parts(); fn(P); const list = [...P.map.values()].flat(); return mergeGeometries(list, false); }

/* ---------------- build-in system ---------------- */
const UNITS = [];
let FAN = null;
function unit(obj, delay, kind = 'pop', dur = 0.42, drop = 4) {
  obj.userData.u = { delay, kind, dur, drop, py: obj.position.y, s: obj.scale.clone() };
  UNITS.push(obj);
  return obj;
}
function updateUnits(T) {
  for (const o of UNITS) {
    const u = o.userData.u;
    const p = clamp((T - u.delay) / u.dur);
    o.visible = p > 0;
    const e = Math.max(1e-3, eBack(p));
    if (u.kind === 'rise') {
      o.scale.set(u.s.x, u.s.y * e, u.s.z);
      o.position.y = u.py - (1 - eOut(p)) * u.drop;
    } else o.scale.set(u.s.x * e, u.s.y * e, u.s.z * e);
  }
}
const popK = (T, delay, dur = 0.38) => Math.max(1e-3, eBack((T - delay) / dur));

// Instanced boxes that pop in individually (used for ~1000 rack pallets).
class PopInst {
  constructor(geo, mat, max, { cast = true, colors = false } = {}) {
    this.mesh = new THREE.InstancedMesh(geo, mat, max);
    this.mesh.castShadow = cast; this.mesh.receiveShadow = true; this.mesh.frustumCulled = false;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    if (colors) this.mesh.setColorAt(0, _c.set(0xffffff));
    this.base = []; this.anc = []; this.del = []; this.done = false; this.dur = 0.26;
  }
  add(matrix, anchor, delay, color) {
    const i = this.base.length;
    this.base.push(matrix.clone()); this.anc.push(anchor.clone()); this.del.push(delay);
    if (color !== undefined) this.mesh.setColorAt(i, _c.set(color));
  }
  finish() {
    this.mesh.count = this.base.length;
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
    this.done = false;
    this.update(BUILD > 0 ? 0 : 1e9);
  }
  update(T) {
    if (this.done) return;
    let all = true;
    for (let i = 0; i < this.base.length; i++) {
      const p = clamp((T - this.del[i]) / this.dur);
      if (p < 1) all = false;
      const k = Math.max(1e-4, eBack(p)), a = this.anc[i];
      _m.makeTranslation(a.x, a.y, a.z).multiply(_m2.makeScale(k, k, k)).multiply(_m2.makeTranslation(-a.x, -a.y, -a.z)).multiply(this.base[i]);
      this.mesh.setMatrixAt(i, _m);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
    if (all) this.done = true;
  }
}

/* =====================================================================
   LIGHTS, SKY, POST
   ===================================================================== */
scene.add(new THREE.HemisphereLight(0xffffff, 0xd3dae2, 1.9));
const sun = new THREE.DirectionalLight(0xfff6ec, 2.35);
sun.position.set(-64, 120, 76);
sun.target.position.set(0, 0, -6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 4.5;
sun.shadow.intensity = 0.58;
Object.assign(sun.shadow.camera, { left: -86, right: 86, top: 86, bottom: -86, near: 30, far: 420 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

{ // vertex-coloured sky dome (no textures)
  const R = 2200, g = new THREE.SphereGeometry(R, 40, 24), pos = g.attributes.position, col = [];
  const top = new THREE.Color(0xcfe0f0).multiplyScalar(1.25), mid = new THREE.Color(0xf4f7fa).multiplyScalar(1.28), bot = new THREE.Color(0xe7ebef).multiplyScalar(1.15);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / R;
    const c = y > 0 ? mid.clone().lerp(top, Math.pow(y, 0.8)) : mid.clone().lerp(bot, Math.pow(-y, 0.5));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, depthWrite: false, fog: false }));
  sky.userData.noAO = true;
  scene.add(sky);
  // soft shadow of the floating slab on the void below
  const catcher = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), new THREE.ShadowMaterial({ opacity: 0.1, color: 0x233a8b }));
  catcher.rotation.x = -HP; catcher.position.set(0, -13, -3); catcher.receiveShadow = true; catcher.userData.noAO = true;
  scene.add(catcher);
}

const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, samples: LITE ? 0 : 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 2, 2);
gtao.output = GTAOPass.OUTPUT.Default;
gtao.blendIntensity = 1.0;
gtao.updateGtaoMaterial({ radius: 2.4, distanceExponent: 1.6, thickness: 2.6, scale: 1.55, samples: LITE ? 8 : 16, distanceFallOff: 1.0, screenSpaceRadius: false });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: LITE ? 4 : 6, rings: 2, samples: LITE ? 8 : 16 });
{ // AO is soft, so on the lite profile it is computed at half resolution and upsampled
  const AO_SCALE = LITE ? 0.5 : 1, ss = gtao.setSize.bind(gtao);
  gtao.setSize = (w, h) => ss(Math.max(2, Math.round(w * AO_SCALE)), Math.max(2, Math.round(h * AO_SCALE)));
}
gtao.normalMaterial.clippingPlanes = CLIP;
// keep transparent shells (walls, roof, glass, sky) out of the AO g-buffer — uses a cached
// list instead of traversing the whole scene twice per frame
const NOAO = [];
gtao.overrideVisibility = function () { for (const o of NOAO) { o.userData._vis = o.visible; o.visible = false; } };
gtao.restoreVisibility = function () { for (const o of NOAO) o.visible = o.userData._vis; };
if (Q.get('ao') !== '0') composer.addPass(gtao);
composer.addPass(new OutputPass());

function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(2, Math.round(r.width)), h = Math.max(2, Math.round(r.height));
  const q = parseFloat(Q.get('q') || '1');
  const pr = Math.min(window.devicePixelRatio || 1, Math.max(1, 1920 / h), LITE ? 2 : 3) * q * DYN.scale;
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
}
const DYN = { scale: 1, last: 0, acc: 0, n: 0, good: 0, skip: 30 };
addEventListener('resize', resize);

/* =====================================================================
   WORLD LAYOUT  (metres; +X east, +Z south/street, facade faces +Z)
   ===================================================================== */
const Y0 = 0.08;                 // vehicle base height
const FL = 0.1;                  // hall floor top
const HALL = { x0: -40, x1: 20, z0: -33, z1: -6, h: 9 };
const DOOR = { x0: -3.7, x1: 1.7, h: 5.6 };
const AISLES = [-33, -26.6, -20.2, -13.8, -7.4, -1, 5.4, 11.8];
const RACK_Z0 = -14.0, BAY_W = 2.75, BAYS = 6, LEVELS = [0, 1.6, 3.2, 4.8];
const SLOT = { x: -3.55, z: -15.375, y: FL + 3.2 };   // rack slot the forklift refills
const SLOT_H = SLOT.y - Y0;                            // fork height (rel.) of that slot
const DECK_H = 1.25;                                   // trailer deck above vehicle base

/* ---------------- ground slab ---------------- */
function lineRect(P, x0, z0, x1, z1, w, mat, y) {
  P.box(x1 - x0 + w, 0.014, w, mat, (x0 + x1) / 2, y, z0, { r: 0.006 });
  P.box(x1 - x0 + w, 0.014, w, mat, (x0 + x1) / 2, y, z1, { r: 0.006 });
  P.box(w, 0.014, z1 - z0, mat, x0, y, (z0 + z1) / 2, { r: 0.006 });
  P.box(w, 0.014, z1 - z0, mat, x1, y, (z0 + z1) / 2, { r: 0.006 });
}
// diagonal yellow/black hazard band (sheared rounded boxes)
function hazardBand(P, x0, z0, x1, z1, y) {
  const along = (x1 - x0) > (z1 - z0) ? 'x' : 'z';
  const len = along === 'x' ? x1 - x0 : z1 - z0, wid = along === 'x' ? z1 - z0 : x1 - x0;
  P.box(x1 - x0, 0.012, z1 - z0, M(C.anth, { r: 0.7 }), (x0 + x1) / 2, y, (z0 + z1) / 2, { r: 0.005 });
  const sw = 0.24, step = 0.5;
  for (let s = wid / 2 + sw / 2 + 0.02; s < len - wid / 2 - sw / 2 - 0.02; s += step) {
    if (along === 'z') P.box(wid - 0.02, 0.014, sw, M(C.yellow, { r: 0.6 }), (x0 + x1) / 2, y + 0.004, z0 + s, { r: 0.005, pre: new THREE.Matrix4().makeShear(0, 1, 0, 0, 0, 0) });
    else P.box(sw, 0.014, wid - 0.02, M(C.yellow, { r: 0.6 }), x0 + s, y + 0.004, (z0 + z1) / 2, { r: 0.005, pre: new THREE.Matrix4().makeShear(0, 0, 0, 0, 1, 0) });
  }
}
// painted 7-segment glyphs (stall labels P1..P4 — paint, not 3D text)
const SEG = { P: 'abfge', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc' };
function glyph(P, ch, cx, cz, H, mat, y) {
  const W = 0.56 * H, s = 0.14 * H;
  const segs = { a: [0, H / 2 - s / 2, 1], g: [0, 0, 1], d: [0, -H / 2 + s / 2, 1], f: [-W / 2 + s / 2, H / 4, 0], b: [W / 2 - s / 2, H / 4, 0], e: [-W / 2 + s / 2, -H / 4, 0], c: [W / 2 - s / 2, -H / 4, 0] };
  for (const k of SEG[ch]) {
    const [u, v, hor] = segs[k];
    if (hor) P.box(W, 0.014, s, mat, cx + u, y, cz - v, { r: 0.006 });
    else P.box(s, 0.014, H / 2 + s / 2, mat, cx + u, y, cz - v, { r: 0.006 });
  }
}

function buildGround() {
  const P = new Parts();
  P.box(116, 4.2, 100, M(C.slab, { r: 0.95 }), 0, -2.75, -3, { r: 1.6, seg: 3 });
  P.box(116.3, 0.7, 100.3, M(C.ground, { r: 0.95 }), 0, -0.35, -3, { r: 0.34, seg: 2 });
  // asphalt yard (inside fence)
  P.box(95.4, 0.06, 58.4, M(C.yard, { r: 0.95 }), 0, 0.03, -10.6, { r: 0.03 });
  // hall floor + apron
  P.box(60, 0.1, 27, M(C.hallFloor, { r: 0.7 }), -10, 0.05, -19.5, { r: 0.04 });
  P.box(7.2, 0.08, 4.8, M(C.apron, { r: 0.9 }), -1, 0.04, -3.6, { r: 0.03 });
  // street, kerbs, pavement
  P.box(116.3, 0.08, 7, M(C.street, { r: 0.92 }), 0, 0.04, 25.5, { r: 0.03 });
  P.box(116.3, 0.16, 2.2, M(C.walk, { r: 0.95 }), 0, 0.08, 30.1, { r: 0.05 });
  P.box(116.3, 0.19, 0.2, M(C.curb), 0, 0.095, 29.1, { r: 0.05 });
  P.box(116.3, 0.19, 0.2, M(C.curb), 0, 0.095, 21.95, { r: 0.05 });

}

function setCurtain(tk, f) {

    const sx = lerp(1, 0.13, e), x = lerp(xc, xo, e);

}

    for (let i = 1; i <= n; i++) this._push(x0 + dx * len * i / n, z0 + dz * len * i / n);
    this.x = x0 + dx * len; this.z = z0 + dz * len; this.lim.push([s0, this._L, vmax]); return this;
  }
  arc(R, dphi, vmax = 6) {
    const s0 = this._L, sg = Math.sign(dphi), ph = this.phi;
    const cx = this.x + R * (sg > 0 ? -Math.sin(ph) : Math.sin(ph)), cz = this.z + R * (sg > 0 ? Math.cos(ph) : -Math.cos(ph));
    const n = Math.max(2, Math.ceil(R * Math.abs(dphi) / this.ds));
    for (let i = 1; i <= n; i++) {
      const th = ph + dphi * i / n;
      this._push(sg > 0 ? cx + R * Math.sin(th) : cx - R * Math.sin(th), sg > 0 ? cz - R * Math.cos(th) : cz + R * Math.cos(th));
    }
    const l = this.pts.at(-1); this.x = l[0]; this.z = l[1]; this.phi = ph + dphi; this.lim.push([s0, this._L, vmax]); return this;
  }
  done() {
    const n = this.pts.length; this.S = new Float64Array(n);
    for (let i = 1; i < n; i++) this.S[i] = this.S[i - 1] + Math.hypot(this.pts[i][0] - this.pts[i - 1][0], this.pts[i][1] - this.pts[i - 1][1]);
    this.L = this.S[n - 1];
    const a = this.pts[0], b = this.pts[1], y = this.pts[n - 2], z = this.pts[n - 1];
    const l0 = Math.hypot(b[0] - a[0], b[1] - a[1]), l1 = Math.hypot(z[0] - y[0], z[1] - y[1]);
    this.d0 = [(b[0] - a[0]) / l0, (b[1] - a[1]) / l0]; this.d1 = [(z[0] - y[0]) / l1, (z[1] - y[1]) / l1];

  at(s, out = {}) {
    const P = this.pts, S = this.S;
    if (s <= 0) { out.x = P[0][0] + this.d0[0] * s; out.z = P[0][1] + this.d0[1] * s; return out; }
    if (s >= this.L) { const e = s - this.L, l = P[P.length - 1]; out.x = l[0] + this.d1[0] * e; out.z = l[1] + this.d1[1] * e; return out; }

    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (S[m] <= s) lo = m; else hi = m; }
    const t = (s - S[lo]) / (S[hi] - S[lo] || 1);

}

// Time-optimal velocity profile with accel/decel limits and per-segment speed caps.
function plan(L, lim, { v0 = 0, v1 = 0, a = 3, b = 3.2 } = {}) {
  const h = 0.05, n = Math.ceil(L / h), dh = L / n;
  const v = new Float64Array(n + 1), t = new Float64Array(n + 1);
  for (let i = 0; i <= n; i++) {
    const s = i * dh; let m = 99;
    for (const [s0, s1, vm] of lim) if (s >= s0 - 1e-6 && s <= s1 + 1e-6) m = Math.min(m, vm);
    v[i] = m;
  }
  v[0] = Math.min(v[0], v0); v[n] = Math.min(v[n], v1);
  for (let i = 1; i <= n; i++) v[i] = Math.min(v[i], Math.sqrt(v[i - 1] * v[i - 1] + 2 * a * dh));
  for (let i = n - 1; i >= 0; i--) v[i] = Math.min(v[i], Math.sqrt(v[i + 1] * v[i + 1] + 2 * b * dh));
  for (let i = 1; i <= n; i++) t[i] = t[i - 1] + dh / Math.max(1e-3, (v[i] + v[i - 1]) / 2);
  return {
    L, T: t[n],
    sAt(tt) {
      if (tt <= 0) return 0; if (tt >= t[n]) return L;
      let lo = 0, hi = n; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (t[m] <= tt) lo = m; else hi = m; }
      return (lo + (tt - t[lo]) / (t[hi] - t[lo])) * dh;
    },
  };
}

function makeTrack(start, c0, segs) {
  let st = { ...start }, dist = 0;
  const out = [];
  for (const sg of segs) {
    const s = { ...sg, p0: { ...st }, d0: dist };
    if (sg.k === 'line') {
      const dx = sg.x - st.x, dz = sg.z - st.z, len = Math.hypot(dx, dz);
      const fw = dx * Math.cos(st.psi) - dz * Math.sin(st.psi) >= 0 ? 1 : -1;
      s.len = len; s.sign = fw; dist += fw * len; st = { x: sg.x, z: sg.z, psi: st.psi };
    } else if (sg.k === 'pivot') { st = { ...st, psi: st.psi + sg.d }; }
    else if (sg.k === 'path') {
      const r = sg.r, e = r.at(r.L); s.len = r.L; s.sign = sg.rev ? -1 : 1; dist += s.sign * r.L;
      st = { x: e.x, z: e.z, psi: r.heading(r.L) + (sg.rev ? PI : 0) };
    }

  }
  return { c0, segs: out, D: dist, end: st };
}
function trackPose(tr, c) {
  let cc = c < tr.c0 ? c + LOOP : c;
  const segs = tr.segs;
  let sg = segs[segs.length - 1];
  for (const s of segs) if (cc >= s.t0 && cc < s.t1) { sg = s; break; }
  const u = clamp((cc - sg.t0) / (sg.t1 - sg.t0));
  const p = sg.p0;
  if (sg.k === 'hold') return { x: p.x, z: p.z, psi: p.psi, d: sg.d0 };
  if (sg.k === 'pivot') return { x: p.x, z: p.z, psi: p.psi + sg.d * eSine(u), d: sg.d0 };
  const e = sg.len > 3 ? eTrap(u) : eSine(u);
  if (sg.k === 'line') return { x: lerp(p.x, sg.x, e), z: lerp(p.z, sg.z, e), psi: p.psi, d: sg.d0 + sg.sign * sg.len * e };

  const g = new THREE.Group(), P = new Parts(), m = M(p.col, { r: 0.3, m: 0.05 });
  P.box(1.8, 1.8, 1.8, m, 0, 0, 0, { r: 0.9, seg: 4 });
  const pre = new THREE.Matrix4().makeRotationX(Math.atan(1 / Math.SQRT2)).multiply(new THREE.Matrix4().makeRotationZ(PI / 4));
  P.box(1.05, 1.05, 1.05, m, 0, -0.95, 0, { r: 0.12, pre });
  P.box(0.5, 0.5, 0.5, M(0xffffff, { r: 0.3 }), 0, 0.15, 0.62, { r: 0.25, seg: 3 });
  g.add(P.build());
  g.position.set(p.x, p.y, p.z);
  scene.add(g);
  return { g, ...p, ph: i * 2.1 };
});

/* =====================================================================
   PER-FRAME UPDATE
   ===================================================================== */
const tmpA = {}, tmpB = {}, tmpC = {};
const kTR = spinK(TK.total, 0.52), kTT = spinK(TK.total, 0.47);
const kFF = spinK(Math.abs(FT.D) || 1, 0.33), kFR = spinK(Math.abs(FT.D) || 1, 0.26), kK = spinK(Math.abs(KT.D) || 1, 0.2);

function poseTruck(tk, route, s, sc) {
  const r = route.at(s, tmpA), f = route.at(s + 3.8, tmpB), b = route.at(s - 10, tmpC);
  tk.tractor.position.set(r.x, Y0, r.z);
  tk.tractor.rotation.y = Math.atan2(-(f.z - r.z), f.x - r.x);
  tk.trailer.position.set(r.x, Y0, r.z);
  tk.trailer.rotation.y = Math.atan2(-(r.z - b.z), r.x - b.x);
  const aT = -sc * kTR, aR = -sc * kTT;
  tk.axF.rotation.z = aT; tk.axR.rotation.z = aT;
  for (const a of tk.trAx) a.rotation.z = aR;
}

function updateWorld(T, c) {
  const vk = popK(T, 0.62, 0.36);
  // fleet
  let minE = 99, minW = 99;
  fleet.forEach((tk, k) => {
    const tau = mod(c + 10 * k, TK.period);
    const st = truckState(tau);
    tk.tractor.visible = tk.trailer.visible = !st.hidden;
    tk.tractor.scale.setScalar(vk); tk.trailer.scale.setScalar(vk);
    poseTruck(tk, st.r, st.s, st.sc);
    setCurtain(tk, curtainAt(tau));
    // the inbound/outbound pallet swap happens while the truck is off the slab
    tk.d2.visible = tau < F_PICK || tau >= TK.xEnd;
    tk.d3.visible = tau >= K_DROP && tau < TK.xEnd;
    if (!st.hidden) for (const p of [tk.tractor.position, tmpC]) {
      minE = Math.min(minE, Math.hypot(p.x - 44, p.z - 16.6));
      minW = Math.min(minW, Math.hypot(p.x + 44, p.z - 16.6));
    }
  });
  // gate barriers lift for passing trucks
  barE.arm.rotation.z = (1 - sstep(8, 16, minE)) * 1.45;
  barW.arm.rotation.z = -(1 - sstep(8, 16, minW)) * 1.45;
  // street traffic
  for (const tv of TRAFFIC) {
    const p = trafficPose(tv, c);
    if (tv.truck) {
      const tk = streetTruck;
      tk.tractor.position.set(p.x, Y0, p.z); tk.trailer.position.set(p.x, Y0, p.z);
      tk.tractor.rotation.y = tk.trailer.rotation.y = p.psi;
      tk.tractor.scale.setScalar(vk); tk.trailer.scale.setScalar(vk);
      const a = -p.s * spinK(p.Lp, 0.52), a2 = -p.s * spinK(p.Lp, 0.47);
      tk.axF.rotation.z = tk.axR.rotation.z = a; for (const ax of tk.trAx) ax.rotation.z = a2;
    } else {
      const g = tv.car.g; g.position.set(p.x, Y0, p.z); g.rotation.y = p.psi; g.scale.setScalar(vk);
      const a = -p.s * spinK(p.Lp, 0.32); for (const ax of tv.car.axles) ax.rotation.z = a;
    }
  }
  // forklift
  const fp = trackPose(FT, c), fh = keyAt(FH, c);
  fork.root.position.set(fp.x, Y0, fp.z); fork.root.rotation.y = fp.psi; fork.root.scale.setScalar(popK(T, 0.7, 0.36));
  fork.car.position.y = fh; fork.inner.position.y = Math.max(0, fh - 1.05) * 0.92;
  fork.axF.rotation.z = -fp.d * kFF; fork.axR.rotation.z = -fp.d * kFR;
  fork.spin.rotation.y = TAU * 2 * c;
  fork.lensM.emissiveIntensity = 0.9 + 1.1 * Math.pow(Math.max(0, Math.sin(TAU * 2 * c)), 2);
  palF.visible = c >= F_PICK && c < F_DROP;
  palS.visible = c >= F_DROP;
  palS.scale.setScalar(popK(T, 0.7, 0.3));
  // stacker
  const kp = trackPose(KT, c), kh = keyAt(KH, c);
  stack.root.position.set(kp.x, Y0, kp.z); stack.root.rotation.y = kp.psi; stack.root.scale.setScalar(popK(T, 0.72, 0.36));
  stack.car.position.y = kh; stack.inner.position.y = Math.max(0, kh - 1.0) * 0.95;
  stack.axF.rotation.z = stack.axR.rotation.z = -kp.d * kK;
  palK.visible = c >= K_PICK && c < K_DROP;
  // walker (one loop per cycle, pauses folded into an eased walk)
  const ws = WALK.L * (c / LOOP), wq = WALK.at(ws);
  walker.g.position.set(wq.x, FL, wq.z); walker.g.rotation.y = WALK.headingLoop(ws); walker.g.scale.setScalar(popK(T, 0.75, 0.3));
  const sw = Math.sin(TAU * c * 1.6) * 0.5;
  walker.legs[0].rotation.z = sw; walker.legs[1].rotation.z = -sw;
  walker.arms[0].rotation.z = -sw * 0.8; walker.arms[1].rotation.z = sw * 0.8;
  // birds
  birds.forEach(b => {
    const a = TAU * c / LOOP + b.ph;
    b.g.position.set(-8 + Math.cos(a) * b.r, b.y + Math.sin(TAU * c / 5 + b.ph) * 0.8, -16 + Math.sin(a) * b.r * 0.8);
    b.g.rotation.y = -a - HP;
    const fl = Math.sin(TAU * c * 3.2 + b.ph) * 0.55;
    b.wings[0].rotation.x = fl; b.wings[1].rotation.x = -fl;
    b.g.scale.setScalar(popK(T, 0.8, 0.3));
  });
  if (FAN) FAN.rotation.y = TAU * 3 * c;
  PINS.forEach((p, i) => {
    p.g.position.y = p.y + 0.4 * Math.sin(TAU * c / 2.5 + p.ph);
    p.g.rotation.y = (i % 2 ? 1 : -1) * TAU * c / LOOP;
    p.g.scale.setScalar(popK(T, 0.82 + i * 0.05, 0.4));
  });
  updateFlags(c, popK(T, 0.55, 0.38));
  updateTrees(T, c);
}

/* ---------------- camera: eased orbit + gentle push-in, period 10 s ---------------- */
const CAM = { az: 1.36, swing: 0.12, el: 0.72, dist: 160, push: 0.07, tx: 0, ty: 0, tz: -9.5 };
function updateCamera(cc) {
  const ph = TAU * cc / LOOP;
  const az = CAM.az - CAM.swing * Math.cos(ph);
  const d = CAM.dist * (1 - CAM.push * (1 - Math.cos(ph)) / 2);
  const el = CAM.el + 0.025 * Math.sin(ph);
  const tx = CAM.tx + 2.5 * Math.sin(ph), tz = CAM.tz - 1.5 * (1 - Math.cos(ph)) / 2;
  camera.position.set(tx + d * Math.sin(az) * Math.cos(el), CAM.ty + d * Math.sin(el), tz + d * Math.cos(az) * Math.cos(el));
  camera.lookAt(tx, CAM.ty, tz);
}


/* ---------------- main loop ---------------- */
let frozen = false;
const MERGE = { queue: [] };
function freezeStatics() { // after the build-in, static units never move again: stop recomposing their matrices
  for (const u of UNITS) u.traverse(o => { if (!o.userData.dyn) { o.updateMatrix(); o.matrixAutoUpdate = false; } });
  scene.updateMatrixWorld();
  // then batch all static scenery into a few big meshes (per material), ~150k vertices per
  // chunk, one chunk per frame so there is no visible hitch
  const groups = new Map();
  for (const u of UNITS) u.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh || !o.visible || o.geometry.index || o.geometry.attributes.position.isInterleavedBufferAttribute) return;
    for (let q = o; q; q = q.parent) if (q.userData.dyn) return;
    const g = o.geometry;
    const key = [o.material.uuid, o.castShadow, o.receiveShadow, !!o.userData.noAO, !!g.attributes.color].join('|');
    let e = groups.get(key); if (!e) groups.set(key, (e = [])); e.push(o);
  });
  for (const list of groups.values()) {
    let cur = [], n = 0;
    for (const m of list) {
      const c = m.geometry.attributes.position.count;
      if (n + c > 60000 && cur.length) { MERGE.queue.push(cur); cur = []; n = 0; }
      cur.push(m); n += c;
    }
    if (cur.length > 1) MERGE.queue.push(cur);
  }
  frozen = true;
}
const _nm = new THREE.Matrix3();
function stepMerge() { // transforms straight into preallocated arrays: no per-mesh clones
  const chunk = MERGE.queue.shift(); if (!chunk) return;
  let n = 0; for (const m of chunk) n += m.geometry.attributes.position.count;
  const hasCol = !!chunk[0].geometry.attributes.color;
  const P = new Float32Array(n * 3), N = new Float32Array(n * 3), Cl = hasCol ? new Float32Array(n * 3) : null;
  let o = 0;
  for (const m of chunk) {
    const g = m.geometry, pa = g.attributes.position.array, na = g.attributes.normal.array, cnt = g.attributes.position.count;
    const e = m.matrixWorld.elements, ne = _nm.getNormalMatrix(m.matrixWorld).elements;
    if (hasCol) Cl.set(g.attributes.color.array, o);
    for (let i = 0, j = 0; i < cnt; i++, j += 3, o += 3) {
      const x = pa[j], y = pa[j + 1], z = pa[j + 2], a = na[j], b = na[j + 1], c = na[j + 2];
      P[o] = e[0] * x + e[4] * y + e[8] * z + e[12];
      P[o + 1] = e[1] * x + e[5] * y + e[9] * z + e[13];
      P[o + 2] = e[2] * x + e[6] * y + e[10] * z + e[14];
      const nx = ne[0] * a + ne[3] * b + ne[6] * c, ny = ne[1] * a + ne[4] * b + ne[7] * c, nz = ne[2] * a + ne[5] * b + ne[8] * c;
      const l = 1 / (Math.sqrt(nx * nx + ny * ny + nz * nz) || 1);
      N[o] = nx * l; N[o + 1] = ny * l; N[o + 2] = nz * l;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(P, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(N, 3));
  if (hasCol) geo.setAttribute('color', new THREE.BufferAttribute(Cl, 3));
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo, chunk[0].material);
  mesh.castShadow = chunk[0].castShadow; mesh.receiveShadow = chunk[0].receiveShadow;
  if (chunk[0].userData.noAO) { mesh.userData.noAO = true; NOAO.push(mesh); }
  mesh.matrixAutoUpdate = false;
  scene.add(mesh);
  for (const m of chunk) { m.visible = false; m.geometry.dispose(); }
}
scene.matrixWorldAutoUpdate = false;   // updated once per frame below (not once per render pass)
function renderAt(T) {
  const c = T < BUILD ? 0 : mod(T - BUILD, LOOP);
  if (!frozen) {
    updateUnits(T);
    for (const ip of [ipBase, ...ipLoad]) ip.update(T);
    if (T > BUILD + 0.6 && !Q.has('manual')) freezeStatics();
  } else if (MERGE.queue.length) stepMerge();
  updateWorld(T, c);
  updateCamera(T - BUILD);
  scene.updateMatrixWorld();
  composer.render();
}
scene.traverse(o => { if (o.userData.noAO) NOAO.push(o); });
resize();
let t0 = null;
// adaptive resolution: if frames take longer than ~19 ms on average, render fewer pixels;
// climb back up when there is headroom (hysteresis avoids flip-flopping)
function adapt(now, T) {
  const dt = now - DYN.last; DYN.last = now;
  if (FREEZE !== null || T < BUILD + 0.8 || document.hidden || dt <= 0 || dt > 500) return;
  if (DYN.skip > 0) { DYN.skip--; return; }
  DYN.acc += dt; DYN.n++;
  if (DYN.n < 40) return;
  const avg = DYN.acc / DYN.n; DYN.acc = 0; DYN.n = 0;
  if (avg > 19 && DYN.scale > 0.6) { DYN.scale = Math.max(0.6, DYN.scale * 0.85); DYN.good = 0; DYN.skip = 20; resize(); }
  else if (avg < 14.5 && DYN.scale < 1) { if (++DYN.good >= 4) { DYN.scale = Math.min(1, DYN.scale / 0.9); DYN.good = 0; DYN.skip = 20; resize(); } }
  else DYN.good = 0;
}
function frame(now) {
  if (t0 === null) t0 = now;
  const T = FREEZE !== null ? BUILD + LOOP + FREEZE : (now - t0) / 1000 + (BUILD === 0 ? 0.0001 : 0);
  renderAt(T);
  adapt(now, T);
  requestAnimationFrame(frame);
}
// debug / capture hooks
window.__wh = { LITE, DYN, NOAO, MERGE, freezeStatics, stepMerge, renderer, composer, scene, fleet, renderAt, TK, PX, PZ, PY1, PY2, SCHED_OK, truckState, trackPose, FT, KT, TRAFFIC, trafficPose, RX, RZ, RY, BUILD, CAM, camera, gtao };
if (!Q.has('manual')) requestAnimationFrame(frame);
</script>
